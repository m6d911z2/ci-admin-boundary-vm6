name: VM6 Playwright 043 JUnit Guard

on:
  pull_request:
    branches:
      - vm6-pw043-junit-protected-261002
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  vm6-pw043-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact shipping Playwright integration
        run: |
          npm init -y
          npm install --no-audit --no-fund @playwright/test@1.62.1 @mergifyio/playwright@0.4.3
      - name: Materialize production quarantine into worker state
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $MERGIFY_TOKEN" \
            'https://api.mergify.com/v1/ci/m6d911z2/repositories/ci-admin-boundary-vm6/quarantines' \
            > "$RUNNER_TEMP/quarantines.json"
          jq -n \
            --arg root "$GITHUB_WORKSPACE" \
            --arg branch "$GITHUB_BASE_REF" \
            --slurpfile q "$RUNNER_TEMP/quarantines.json" \
            '{version:1,testRunId:"vm6-pw043-production",createdAt:"2026-10-02T00:00:00Z",rootDir:$root,quarantinedTests:[$q[0].quarantined_tests[] | select(.branch == null or .branch == $branch) | .test_name]}' \
            > "$RUNNER_TEMP/mergify-state.json"
          jq '{quarantinedTests}' "$RUNNER_TEMP/mergify-state.json"
      - name: Run protected Playwright guard
        env:
          MERGIFY_STATE_FILE: ${{ runner.temp }}/mergify-state.json
          MERGIFY_RERUN_FILE: '1'
        run: |
          cat > playwright.vm6.config.mjs <<'JS'
          export default { testDir: './vm6-pw043-tests', workers: 1, reporter: 'line' };
          JS
          npx playwright test -c playwright.vm6.config.mjs
