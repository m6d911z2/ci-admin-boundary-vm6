name: VM6 GitHub token logs cross-repo 261006
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mergify logs repo binding A/B
        env:
          GH_TOKEN_FOR_MERGIFY: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; url="$2"
            code=$(curl -sS -o "$RUNNER_TEMP/$label.json" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN_FOR_MERGIFY" \
              -H 'Accept: application/json' "$url")
            echo "VM6_${label}_HTTP=$code"
            cat "$RUNNER_TEMP/$label.json"
            echo
          }
          probe SOURCE 'https://api.mergify.com/v1/repos/m6d911z2/ci-admin-boundary-vm6/logs?per_page=2'
          probe SIBLING 'https://api.mergify.com/v1/repos/m6d911z2/vm6-barrier-rename-20260912/logs?per_page=2'
