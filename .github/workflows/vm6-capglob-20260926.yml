name: VM6 capglob runtime

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scopes-upload:
    if: ${{ !startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload controlled manual scope
        uses: Mergifyio/gha-mergify-ci@0fc785ffb514dd34f73b198f1fbeb56bebecc789
        with:
          action: scopes-upload
          scopes: '@acme/capglob'
          token: ${{ secrets.MERGIFY_TOKEN }}

  vm6-combined-guard:
    if: ${{ startsWith(github.head_ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail only on untested combined A+B state
        shell: bash
        run: |
          echo "A=$(test -f vm6-capglob/a.txt && echo 1 || echo 0) B=$(test -f vm6-capglob/b.txt && echo 1 || echo 0)"
          if [[ -f vm6-capglob/a.txt && -f vm6-capglob/b.txt ]]; then
            echo 'VM6_COMBINED_GUARD_FAIL_A_PLUS_B'
            exit 1
          fi
          echo 'VM6_COMBINED_GUARD_PASS_SINGLE'
