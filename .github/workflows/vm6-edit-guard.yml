name: VM6 edit guard
on:
  pull_request:

jobs:
  vm6-edit-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject externally edited batch marker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vm6-edit-malicious.txt ]]; then
            echo 'edited batch marker present; this head must not inherit an earlier success'
            sleep 90
            exit 1
          fi
          echo 'clean batch head'
