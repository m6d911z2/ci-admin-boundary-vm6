name: VM6 edit guard
on:
  pull_request:

jobs:
  vm6-edit-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard edited batch head
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vm6-edit-malicious.txt ]]; then
            echo 'edited batch marker present; this new head must not inherit the clean head success'
            sleep 150
            exit 1
          fi
          echo 'clean batch head'
  vm6-edit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delayed release check
        shell: bash
        run: |
          set -euo pipefail
          echo 'deliberately holding the clean head while guard has already succeeded'
          sleep 75
          echo 'release success'
