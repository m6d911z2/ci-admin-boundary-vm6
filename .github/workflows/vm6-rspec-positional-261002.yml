name: VM6 RSpec Positional Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - vm6-rspec-positional-protected-261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rspec:
    name: vm6-rspec-positional-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install released RSpec integration
        run: |
          gem install rspec -v 3.13.2 --no-document
          gem install rspec-mergify -v 0.3.0 --no-document
      - name: Run trusted RSpec suite and print logical IDs
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          RUBYOPT: -rrspec_mergify
        shell: bash
        run: |
          set +e
          rspec spec/guard_spec.rb --format progress --format json --out /tmp/vm6-rspec.json
          rc=$?
          ruby -rjson -e 'j=JSON.parse(File.read("/tmp/vm6-rspec.json")); j["examples"].each{|e| puts "VM6_RSPEC_ID=#{e["id"]} DESC=#{e["description"]} STATUS=#{e["status"]}"}'
          exit "$rc"
