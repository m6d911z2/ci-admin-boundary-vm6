name: VM6 AutoQ Isolation 20261014
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Controlled bad or good test outcome"
        required: true
        type: choice
        options:
          - bad
          - good
jobs:
  vitest:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      AUTOQ_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Compare Mergify and native Vitest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vm6-autoq-261014
          cd /tmp/vm6-autoq-261014
          cat > package.json <<'JSON'
          {"name":"vm6-autoq-261014","private":true,"type":"module"}
          JSON
          corepack pnpm add vitest@4.1.10 @mergifyio/vitest@0.4.1 --reporter=silent
          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import MergifyReporter from '@mergifyio/vitest';
          export default defineConfig({ test: { include: ['*.test.mjs'], reporters: ['default', new MergifyReporter()] } });
          JS
          cat > control.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({ test: { include: ['*.test.mjs'], reporters: ['default'] } });
          JS
          cat > autoq.test.mjs <<'JS'
          import { describe, test, expect } from 'vitest';
          describe('security', () => {
            test('vm6-crossrepo-autoq-z1-261014', () => {
              console.log('VM6_AUTOQ_MODE_OBSERVED=' + process.env.AUTOQ_MODE);
              expect(2).toBe(process.env.AUTOQ_MODE === 'bad' ? 3 : 2);
            });
          });
          JS
          echo VM6_TEST_RUN_WITH_MERGIFY_REPORTER
          corepack pnpm exec vitest run --config vitest.config.mjs
          echo VM6_TEST_RUN_WITH_NATIVE_VITEST_ONLY
          set +e
          corepack pnpm exec vitest run --config control.config.mjs
          native_status=$?
          set -e
          echo VM6_NATIVE_VITEST_EXIT_STATUS=$native_status
