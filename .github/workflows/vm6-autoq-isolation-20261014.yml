name: VM6 AutoQ Isolation 20261014
on:
  workflow_dispatch:
jobs:
  vitest:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run isolated positive test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vm6-autoq-261014
          cd /tmp/vm6-autoq-261014
          cat > package.json <<'JSON'
          {"name":"vm6-autoq-261014","private":true,"type":"module"}
          JSON
          corepack pnpm add vitest@4.1.10 @mergifyio/vitest@0.4.1 --reporter=silent
          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import MergifyReporter from '@mergifyio/vitest';
          export default defineConfig({ test: { include: ['*.test.mjs'], reporters: ['default', new MergifyReporter()] } });
          JS
          cat > autoq.test.mjs <<'JS'
          import { describe, test, expect } from 'vitest';
          describe('security', () => {
            test('vm6-autoq-isolation-261014-c7', () => {
              expect(2).toBe(2);
            });
          });
          JS
          corepack pnpm exec vitest run --config vitest.config.mjs
