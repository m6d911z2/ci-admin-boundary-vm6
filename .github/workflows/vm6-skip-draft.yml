name: VM6 skip intermediate draft freshness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  vm6-skip-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Gate by speculative draft shape
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          echo "head_ref=$HEAD_REF changed_files=$CHANGED_FILES"
          case "$HEAD_REF" in
            mergify/merge-queue/*)
              if [ "$CHANGED_FILES" = "1" ]; then
                echo "ancestor-only speculative draft: keep intermediate result slow"
                sleep 300
              fi
              ;;
          esac
          echo "gate success"

  vm6-skip-release:
    runs-on: ubuntu-latest
    steps:
      - name: Hold later cumulative result for draft conversion
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          echo "head_ref=$HEAD_REF changed_files=$CHANGED_FILES"
          case "$HEAD_REF" in
            mergify/merge-queue/*)
              if [ "$CHANGED_FILES" = "1" ]; then
                echo "ancestor-only speculative draft: hold"
                sleep 300
              else
                echo "later cumulative draft: hold finalization window"
                sleep 150
              fi
              ;;
          esac
          echo "release success"
