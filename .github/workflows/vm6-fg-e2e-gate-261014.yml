name: VM6 Exact CI Gate 20261014
on:
  pull_request:
    branches:
      - vm6-fg-e2e-base-261014
permissions:
  contents: read
jobs:
  vm6-fg-e2e-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mergify reporter and native control
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vm6-exactgate-261014"
          cd "$RUNNER_TEMP/vm6-exactgate-261014"
          printf '%s\n' '{"name":"vm6-exactgate-261014","private":true,"type":"module"}' > package.json
          corepack pnpm add vitest@4.1.10 @mergifyio/vitest@0.4.1 --reporter=silent
          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import MergifyReporter from '@mergifyio/vitest';
          export default defineConfig({ test: { include: ['*.test.mjs'], reporters: ['default', new MergifyReporter()] } });
          JS
          cat > control.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({ test: { include: ['*.test.mjs'], reporters: ['default'] } });
          JS
          cat > marker.test.mjs <<'JS'
          import { describe, test, expect } from 'vitest';
          import { readFileSync } from 'node:fs';
          describe('security', () => {
            test('vm6-autoq-isolation-261014-c7', () => {
              const marker = readFileSync(process.env.GITHUB_WORKSPACE + '/vm6-fg-e2e-payload-261014.txt', 'utf8').trim();
              console.log('VM6_E2E_PR_MARKER=' + marker);
              expect(marker).toBe('SAFE');
            });
          });
          JS
          echo VM6_GATE_REPORTER_START
          corepack pnpm exec vitest run --config vitest.config.mjs
          echo VM6_GATE_NATIVE_CONTROL_START
          set +e
          corepack pnpm exec vitest run --config control.config.mjs
          native_status=$?
          set -e
          echo VM6_GATE_NATIVE_CONTROL_EXIT=$native_status
