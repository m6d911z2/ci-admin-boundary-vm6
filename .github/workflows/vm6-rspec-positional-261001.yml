name: VM6 RSpec Positional Quarantine Gate

on:
  push:
    branches: [main]
    paths:
      - 'spec/vm6_rspec_positional_spec.rb'
      - '.github/workflows/vm6-rspec-positional-261001.yml'
  pull_request:
    branches: [main]
    paths:
      - 'spec/vm6_rspec_positional_spec.rb'

permissions:
  contents: read

jobs:
  rspec:
    name: vm6-rspec-gate
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install shipping RSpec integration
        run: |
          gem install rspec -v 3.13.2 --no-document
          gem install rspec-mergify -v 0.3.0 --no-document
      - name: Run positional quarantine gate
        run: rspec -r rspec_mergify spec/vm6_rspec_positional_spec.rb --format documentation
