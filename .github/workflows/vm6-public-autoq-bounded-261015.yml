name: VM6 Cross Repo AutoUnquarantine Health Discriminator 261015
on:
  workflow_dispatch:
    inputs:
      verdict:
        description: "Synthetic CI test conclusion, owned public repo only"
        required: true
        type: choice
        options: [failed, passed]
permissions:
  contents: read
jobs:
  reporter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      VM6_TEST_VERDICT: ${{ inputs.verdict }}
    steps:
      - name: Validate reporter key and source repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "m6d911z2/ci-admin-boundary-vm6" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Refusing non-public or non-main source'
            exit 1
          fi
          node --input-type=module <<'JS'
          const token=process.env.MERGIFY_TOKEN;
          if (!token) throw Error('No research CI key');
          const r=await fetch('https://api.mergify.com/v1/application',{headers:{Authorization:'Bearer '+token}});
          const info=await r.json().catch(()=>({}));
          console.log('VM6_KEY_HTTP='+r.status);
          console.log('VM6_KEY_SCOPE='+info.scope);
          console.log('VM6_KEY_ACCOUNT='+info.account_scope?.login);
          if(!r.ok || info.scope!=='ci' || info.account_scope?.login!=='m6d911z2')throw Error('Unapproved CI key account');
          JS
      - name: Publish synthetic public-only CI test result
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund @mergifyio/ci-core@0.3.4
          cat > vm6-public-health-collision.mjs <<'JS'
          import {createTracing, generateTestRunId, startSessionSpan, emitTestCaseSpan, endSessionSpan} from '@mergifyio/ci-core';
          const repoName='m6d911z2/ci-admin-boundary-vm6', repoId=1365916854;
          const result=process.env.VM6_TEST_VERDICT;
          if (!['failed','passed'].includes(result) || process.env.GITHUB_REPOSITORY!==repoName || process.env.GITHUB_REF!=='refs/heads/main')
            throw Error('Unsupported research source/verdict');
          const t=createTracing({
            token:process.env.MERGIFY_TOKEN, repoName,
            testRunId:generateTestRunId(),apiUrl:'https://api.mergify.com',
            frameworkAttributes:{'test.framework':'vitest','test.framework.version':'4.1.10',
              'vcs.repository.name':repoName,'vcs.repository.url.full':'https://github.com/'+repoName,'vcs.repository.id':repoId},
            tracerName:'vm6-b-public-crossrepo-autoq-discriminator'
          });
          if(!t)throw Error('No official CI exporter');
          const session=startSessionSpan(t,'VM6 B-only public health transition experiment');
          const data={
            filepath:'vm6-owned-fixai-marker.spec.mjs',
            absoluteFilepath:'/vm6-controlled/vm6-owned-fixai-marker.spec.mjs',
            function:'VM6_FIXAI_SHARED_SHORT_261015',lineno:1,namespace:'security',
            scope:'case',status:result,duration:45,startTime:Date.now()-90,
            retryCount:0,flaky:false
          };
          if(result==='failed'){
            const marker='VM6_PUBLIC_ONLY_HEALTH_FAILURE_261015';
            data.error={type:'VM6IntentionalResearchFailure',message:marker,stacktrace:marker+' at vm6-owned-fixai-marker.spec.mjs:1:1'};
          }
          emitTestCaseSpan(t.tracer,session,data);
          await endSessionSpan(t,session,result);
          console.log('VM6_PUBLIC_ONLY_CI_EXPORT_COMPLETE='+result);
          JS
          node vm6-public-health-collision.mjs
