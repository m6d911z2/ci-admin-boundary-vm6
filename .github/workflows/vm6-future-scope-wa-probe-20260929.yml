name: VM6 Future Scope WA Probe 20260929
on:
  workflow_dispatch:
    inputs:
      mode:
        description: meta or preseed
        required: true
        default: meta
      sha:
        description: target commit SHA for preseed
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    steps:
      - name: Application metadata
        if: inputs.mode == 'meta'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $MERGIFY_TOKEN"             https://api.mergify.com/v1/application             | jq -c '{id,name,scope,account_scope}'

      - name: Preseed future commit scope
        if: inputs.mode == 'preseed'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.sha }}"
          status="$(curl -sS -o response.txt -w '%{http_code}'             -X PUT             -H "Authorization: Bearer $MERGIFY_TOKEN"             -H 'Content-Type: application/json'             --data '{"scopes":["vm6-future-scope-wa-20260929"],"all_scopes":false}'             "https://api.mergify.com/v1/repos/m6d911z2/vm6-barrier-rename-20260912/commits/${{ inputs.sha }}/scopes")"
          echo "HTTP_STATUS=$status"
          cat response.txt
          test "$status" = "204"
