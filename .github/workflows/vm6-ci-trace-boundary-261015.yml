name: VM6 CI Trace Account Boundary
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Owned test destination only"
        type: choice
        required: true
        options:
          - owner_control
          - separate_account
permissions:
  contents: read
jobs:
  trace-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      VM6_TRACE_TARGET: ${{ inputs.target }}
    steps:
      - name: Verify CI key account scope without displaying credential
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          const token = process.env.MERGIFY_TOKEN;
          if (!token) throw Error('No existing CI credential available');
          const resp = await fetch('https://api.mergify.com/v1/application', {
            headers: {Authorization: 'Bearer ' + token}
          });
          const data = await resp.json().catch(() => ({}));
          console.log('VM6_KEY_CHECK_HTTP=' + resp.status);
          console.log('VM6_KEY_SCOPE=' + (data.scope ?? 'unknown'));
          console.log('VM6_KEY_ACCOUNT=' + (data.account_scope?.login ?? 'unknown'));
          if (!resp.ok || data.scope !== 'ci' || data.account_scope?.login !== 'm6d911z2') {
            throw Error('CI key must belong to exact research-owned m6d911z2 account');
          }
          JS
      - name: Export one inert research test trace using official Mergify core
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund @mergifyio/ci-core@0.3.4
          cat > vm6-trace.mjs <<'JS'
          import { createTracing, startSessionSpan, emitTestCaseSpan, endSessionSpan, generateTestRunId } from '@mergifyio/ci-core';
          const targets = {
            owner_control: 'm6d911z2/ci-admin-boundary-vm6',
            separate_account: 'livastic-vm6-primary-20260911/vm6-delete-reverse-20260914-preclaim-0917'
          };
          const targetName = process.env.VM6_TRACE_TARGET;
          const destination = targets[targetName];
          if (!destination) throw Error('Destination must be an allowlisted owned test repository');
          const title = targetName === 'owner_control'
            ? 'VM6_TRACE_ACCOUNT_CONTROL_261015'
            : 'VM6_TRACE_ACCOUNT_FOREIGN_261015';
          const testRunId = generateTestRunId();
          console.log('VM6_TRACE_DESTINATION=' + destination);
          console.log('VM6_TRACE_TITLE=' + title);
          console.log('VM6_TRACE_RUN_ID=' + testRunId);
          const tracing = createTracing({
            apiUrl: 'https://api.mergify.com',
            token: process.env.MERGIFY_TOKEN,
            repoName: destination,
            frameworkAttributes: {
              'test.framework': 'vitest',
              'test.framework.version': '4.1.10'
            },
            testRunId,
            tracerName: 'vm6-owned-account-boundary'
          });
          if (!tracing) throw Error('Mergify CI trace context not created');
          const session = startSessionSpan(tracing, 'VM6 inert owned research account-boundary session');
          emitTestCaseSpan(tracing.tracer, session, {
            filepath: 'vm6-trace-boundary.mjs',
            absoluteFilepath: '/vm6-controlled/vm6-trace-boundary.mjs',
            function: title,
            lineno: 1,
            namespace: 'security',
            scope: 'case',
            status: 'passed',
            duration: 33,
            startTime: Date.now() - 60,
            retryCount: 0,
            flaky: false
          });
          try {
            await endSessionSpan(tracing, session, 'passed');
            console.log('VM6_TRACE_EXPORT_ACCEPTED_BY_SDK');
          } catch (err) {
            console.error('VM6_TRACE_EXPORT_FAILED=' + String(err?.message ?? err).slice(0,300));
            process.exitCode = 17;
          }
          JS
          node vm6-trace.mjs
