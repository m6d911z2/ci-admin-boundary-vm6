pull_request_rules:
  - name: VM6 queue branch edit detector canary
    conditions:
      - label = vm6-queue-edit-trigger
    actions:
      queue:
        name: default
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - label = vm6-never-merge
    merge_method: fast-forward
    allow_queue_branch_edit: false
