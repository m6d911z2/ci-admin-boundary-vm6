pull_request_rules:

  - name: VM6 capglob label queue
    conditions:
      - label = vm6-capglob-queue-20260926
    actions:
      queue: {}

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

queue_rules:
  - name: vm6-capglob-20260926
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-combined-guard
    batch_size: 2
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - vm6-resolver-conflict.txt
        strategy: theirs
    checks_timeout: null

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual:
  capacities:
    '@acme/*': 1
