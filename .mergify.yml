priority_rules:
  - name: vm6 crprio C high2 261003
    priority: 10000
    conditions:
      - title = VM6_CRPRIO_C_HIGH2_261003
    allow_checks_interruption: true
  - name: vm6 crprio A trusted2 261003
    priority: 5000
    conditions:
      - title = VM6_CRPRIO_A2_261003
    allow_checks_interruption: true
  - name: vm6 crprio B low2 261003
    priority: 1000
    conditions:
      - title = VM6_CRPRIO_B2_LOW_261003
    allow_checks_interruption: true

pull_request_rules:

  - name: VM6 RSpec positional quarantine protected merge 261002
    conditions:
      - base = vm6-rspec-positional-protected-261002
      - title = VM6_RSPEC_POSITIONAL_B_261002
      - author = livastic-vm6-primary-20260911
      - check-success = vm6-rspec-gate
      - files = lib/vm6_cases.rb
      - -files ~= ^spec/
      - -files ~= ^\.github/workflows/
      - -files ~= ^Gemfile
      - -files = .mergify.yml
    actions:
      merge:
        method: merge

  - name: VM6 capglob label queue
    conditions:
      - label = vm6-capglob-queue-20260926
    actions:
      queue: {}

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

queue_rules:
  - name: vm6-crprio-newhigh-261003
    queue_conditions:
      - base = vm6-crprio2-base-261003
    merge_conditions:
      - check-success = vm6-crprio2-never
    batch_size: 2
    batch_max_wait_time: 20s
    merge_method: merge-batch
    checks_timeout: null
    conflict_resolvers:
      - paths:
          - crprio2.txt
        strategy: theirs

  - name: vm6-freezerev-261002
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-freezerev-gate
    batch_size: 1
    merge_method: merge
    checks_timeout: null

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual:
  capacities:
    '@acme/*': 2
