pull_request_rules:

  - name: VM6 RSpec positional quarantine protected merge 261002
    conditions:
      - base = vm6-rspec-positional-protected-261002
      - title = VM6_RSPEC_POSITIONAL_B_261002
      - author = livastic-vm6-primary-20260911
      - check-success = vm6-rspec-gate
      - files = lib/vm6_cases.rb
      - -files ~= ^spec/
      - -files ~= ^\.github/workflows/
      - -files ~= ^Gemfile
      - -files = .mergify.yml
    actions:
      merge:
        method: merge

  - name: VM6 capglob label queue
    conditions:
      - label = vm6-capglob-queue-20260926
    actions:
      queue: {}

  - name: VM6 comment bot command sender confusion 261002
    conditions:
      - title = VM6_COMMENT_BOT_COMMAND_261002
      - author = livastic-vm6-primary-20260911
      - label = vm6-comment-bot-ready-261002
      - -label = vm6-comment-bot-fired-261002
    actions:
      comment:
        message: "{{body}}"
      label:
        add:
          - vm6-comment-bot-fired-261002

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= admin

queue_rules:
  - name: vm6-freezerev-261002
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-freezerev-gate
    batch_size: 1
    merge_method: merge
    checks_timeout: null

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual:
  capacities:
    '@acme/*': 2
