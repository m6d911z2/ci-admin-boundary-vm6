pull_request_rules:
  - name: VM6 capglob label queue
    conditions:
      - label = vm6-capglob-queue-20260926
    actions:
      queue: {}

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

queue_rules:
  - name: vm6-capglob-files-20260927
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-capglob-hold
    batch_size: 1
    merge_method: merge
    checks_timeout: null

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      acme/capglob:
        include:
          - vm6-capglob/**
  capacities:
    'acme/*': 1
