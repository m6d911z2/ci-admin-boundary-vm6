merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
merge_protections:
  - name: VM6 bot-account must honor impossible protection
    if:
      - number = 65
    success_conditions:
      - label = vm6-bot-mp-never-20260916
pull_request_rules:
  - name: VM6 satisfy disposable protection control
    conditions:
      - number = 65
      - -draft
      - -closed
    actions:
      label:
        add:
          - vm6-bot-mp-never-20260916
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
queue_rules:
  - name: default
    queue_conditions: []
