pull_request_rules:

  - name: VM6 PW043 cross-format protected merge 261002
    conditions:
      - base = vm6-pw043-crossformat-protected-261002
      - title = VM6_PW043_CROSSFORMAT_TREATMENT_261002
      - author = livastic-vm6-primary-20260911
      - label = vm6-pw043-crossformat-ready-261002
      - check-success = vm6-pw043-crossformat-guard
    actions:
      merge:
        method: merge
  - name: VM6 capglob label queue
    conditions:
      - label = vm6-capglob-queue-20260926
    actions:
      queue: {}

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

queue_rules:
  - name: vm6-capglob-20260926
    queue_conditions: []
    merge_conditions:
      - base = main
    batch_size: 1
    merge_method: merge-batch
    conflict_resolvers:
      - paths:
          - vm6-resolver-conflict.txt
        strategy: theirs
    checks_timeout: null

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual:
  capacities:
    '@acme/*': 1
